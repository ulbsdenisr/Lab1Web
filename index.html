<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIN Decoder</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="topnav">
      <a href="index.html" class="active">VIN Decoder</a>
      <a href="checklist.html">Checklist</a>
      <a href="insights.html">Insights</a>
      <a href="about.html">About</a>
    </nav>

    <main class="app">
      <section class="card">
        <p class="eyebrow">Vehicle lookup</p>
        <h1>VIN Decoder</h1>

        <form id="vin-form">
          <label for="vin">VIN</label>
          <div class="input-row">
            <input
              id="vin"
              type="text"
              maxlength="17"
              placeholder="1HGCM82633A004352"
              autocomplete="off"
            />
            <button type="submit">Decode</button>
          </div>
        </form>

        <p id="status" class="status">Enter a 17-character VIN.</p>

        <div id="result" class="result hidden">
          <div class="grid">
            <div class="item">
              <span>Year</span>
              <strong id="year">—</strong>
            </div>
            <div class="item">
              <span>Make</span>
              <strong id="make">—</strong>
            </div>
            <div class="item">
              <span>Model</span>
              <strong id="model">—</strong>
            </div>
            <div class="item">
              <span>Trim</span>
              <strong id="trim">—</strong>
            </div>
            <div class="item">
              <span>Engine</span>
              <strong id="engine">—</strong>
            </div>
            <div class="item">
              <span>Drivetrain</span>
              <strong id="drivetrain">—</strong>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
